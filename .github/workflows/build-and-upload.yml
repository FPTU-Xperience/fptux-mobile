name: Build Debug APK and Upload to R2

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: API Gateway base URL (bỏ trống để dùng vars.VITE_API_BASE_URL)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-debug-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ===== Lưu ý quan trọng về bản dev-client =====
      # Profile "development" (eas.json) là DEV-CLIENT: build debug variant →
      # JS bundle KHÔNG được nhúng vào APK. App chỉ chạy được khi kết nối
      # Metro (npx expo start) → quét QR. Vì vậy EXPO_PUBLIC_* KHÔNG được
      # inlines lúc build này — chúng lấy từ .env CẢNH LOCAL của người chạy
      # `expo start`. Các biến dưới đây chỉ dùng cho bước prebuild/native và
      # để profile "env" trong eas.json không bị ghi đè; không ảnh hưởng JS
      # runtime của dev-client.
      #
      # EXPO_PUBLIC_GOOGLE_CLIENT_ID: cùng secret với web UI + API. Cho dev-client,
      # giá trị thực sự được nhúng vào JS là từ .env local của dev (phải có cùng
      # client ID này trong .env local). Giữ ở đây cho đồng bộ + cho bản build
      # nhúng bundle (profile preview/production).
      EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.CLUBHUB_GOOGLE_CLIENT_ID }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
      EXPO_PUBLIC_DEV_ACCESS_TOKEN: ${{ secrets.CLUBHUB_DEV_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Expo SDK 58 yêu cầu Node ^22.13.0 || ^24.3.0 || ^26.0.0 (node_modules/expo/package.json).
          # Node 18/20 sẽ bị Expo CLI chặn.
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `eas build --local` cần Android SDK + NDK + CMake có sẵn trên máy.
      # Pin khớp ExpoRootProjectPlugin.kt:204-208:
      #   compileSdk 37 · buildTools 37.0.0 · NDK 27.1.12297006 · CMake 3.22.1
      # NDK + CMake bắt buộc: react-native-nitro-modules & react-native-worklets compile C++.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Input boolean (getBooleanInput) — không dùng "yes".
          accept-android-sdk-licenses: true
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      # EAS local build vẫn cần auth (EXPO_TOKEN) để resolve project/credentials.
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Bản dev-client: có dev-launcher → mở app hiện màn hình nhập URL Metro
      # (quét QR) thay vì nhúng JS bundle. Đây là bản dùng để dev.
      # `--local` build native project TRỰC TIẾP trên runner → cần Android SDK
      # (NDK + CMake) và JDK đã setup ở trên; EAS local build vẫn yêu cầu EXPO_TOKEN
      # để resolve project/credentials (auth).
      - name: Build Debug APK locally via EAS
        run: |
          npx --yes eas-cli build \
            --platform android \
            --profile development \
            --local \
            --non-interactive \
            --output ./app-debug.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload to Cloudflare R2
        env:
          # Cùng secrets với web UI + API (fptu-xperience-clubhub-ui / -api).
          # Endpoint suy ra từ CLOUDFLARE_ACCOUNT_ID: https://<id>.r2.cloudflarestorage.com
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: node scripts/upload-to-r2.js ./app-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          retention-days: 30
          if-no-files-found: error
